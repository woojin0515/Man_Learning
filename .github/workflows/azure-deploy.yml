name: Deploy ManLearning.Web to Azure App Service

# Builds and deploys ManLearning.Web (the Blazor Web App currently hosted on the
# manlearning-woojin-krc App Service, per ADR 0010) whenever master changes.
#
# Authenticates to Azure via OIDC (azure/login, federated credential - no client
# secret or publish profile is stored in the repository). This App Service has
# "SCM Basic Auth Publishing Credentials" disabled, so publish-profile-based
# deployment does not work here; OIDC is also the Microsoft-recommended approach
# for GitHub Actions -> Azure authentication.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: manlearning-woojin-krc
  AZURE_RESOURCE_GROUP: rg-manlearning-krc
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: src/ManLearning.Web/ManLearning.Web.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ManLearning.sln

      - name: Build
        run: dotnet build ManLearning.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ManLearning.sln --configuration Release --no-build --verbosity normal

      - name: Publish ManLearning.Web
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-build
          --output ${{ env.PUBLISH_DIR }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Azure logout
        if: always()
        run: az logout

